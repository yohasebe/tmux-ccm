# ccm - status bar integration (load AFTER TPM)
# Window-based architecture

# Set status-right to ccm-only (replaces theme's time/date)
run-shell '~/Dropbox/code/ccm/ccm inject-status'

# Immediate refresh on window events
set-hook -g window-linked 'run-shell -b "~/Dropbox/code/ccm/ccm inject-status"'
set-hook -g window-unlinked 'run-shell -b "~/Dropbox/code/ccm/ccm inject-status"'
set-hook -g window-renamed 'run-shell -b "~/Dropbox/code/ccm/ccm inject-status"'
set-hook -g client-session-changed 'run-shell -b "~/Dropbox/code/ccm/ccm clear-done; ~/Dropbox/code/ccm/ccm inject-status"'
set-hook -g session-window-changed 'run-shell -b "~/Dropbox/code/ccm/ccm clear-done; ~/Dropbox/code/ccm/ccm inject-status"'

# Periodic refresh via #() embedded in status-right (every status-interval)
set -g status-interval 5
set -g status-right-length 200

# Hide window name/status
set -g window-status-format ''
set -g window-status-current-format ''
