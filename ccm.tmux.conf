# ccm - tmux configuration (legacy source-file method)
#
# Recommended: Use TPM instead:
#   set -g @plugin 'yohasebe/tmux-claude-code-manager'
#
# Manual installation:
#   source-file /path/to/ccm/ccm.tmux.conf
#
# Customizable keys (set before sourcing):
#   set -g @ccm-key-dashboard "Tab"   # default: Tab
#   set -g @ccm-key-menu "C"          # default: C (uppercase)
#   set -g @ccm-key-tree "T"          # default: T (uppercase)

run-shell "#{d:current_file}/ccm.tmux"
