# ccm - tmux keybindings (window-based architecture)
# Add to your tmux.conf (before TPM init):
#   source-file "$HOME/Dropbox/code/ccm/ccm.tmux.conf"

# Resolve CCM_ROOT from this config file's location
# Users can override by setting CCM_ROOT before sourcing
%if "#{==:#{CCM_ROOT},}"
CCM_ROOT="$HOME/Dropbox/code/ccm"
%endif

# Session file path (user-scoped temp dir)
# run-shell uses /bin/sh, so $TMPDIR and $UID are available

# prefix + Tab: Dashboard popup
bind Tab run-shell 'mkdir -p "${TMPDIR:-/tmp}/ccm-$(id -u)" && printf "#{session_name}" > "${TMPDIR:-/tmp}/ccm-$(id -u)/popup-session"' \; display-popup -E -w 80% -h 60% -T " ccm Dashboard " "$HOME/Dropbox/code/ccm/ccm dashboard"

# prefix + C (uppercase): ccm menu popup
bind C run-shell 'mkdir -p "${TMPDIR:-/tmp}/ccm-$(id -u)" && printf "#{session_name}" > "${TMPDIR:-/tmp}/ccm-$(id -u)/popup-session"' \; display-popup -E -w 60% -h 40% -T " ccm Menu " "$HOME/Dropbox/code/ccm/ccm menu"

# prefix + t: Tree popup (toggle)
bind t run-shell 'mkdir -p "${TMPDIR:-/tmp}/ccm-$(id -u)" && printf "#{session_name}" > "${TMPDIR:-/tmp}/ccm-$(id -u)/popup-session"' \; display-popup -E -w 80% -h 60% -T " ccm Tree " "$HOME/Dropbox/code/ccm/ccm tree-interactive"

# Restore prefix + w to default (choose-tree)
bind w choose-tree -Zs

# Clear stale function key bindings
unbind F1
unbind F2

# Click on status-right to open dashboard
bind -T root MouseDown1StatusRight run-shell 'mkdir -p "${TMPDIR:-/tmp}/ccm-$(id -u)" && printf "#{session_name}" > "${TMPDIR:-/tmp}/ccm-$(id -u)/popup-session"' \; display-popup -E -w 80% -h 60% -T " ccm Dashboard " "$HOME/Dropbox/code/ccm/ccm dashboard"
