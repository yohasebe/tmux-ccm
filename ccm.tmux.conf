# ccm - tmux keybindings (window-based architecture)
# Add to your tmux.conf (before TPM init):
#   source-file "$HOME/Dropbox/code/ccm/ccm.tmux.conf"

# prefix + Tab: Dashboard popup
# run-shell expands #{session_name} reliably; writes to temp file for popup to read
bind Tab run-shell 'printf "#{session_name}" > /tmp/ccm-popup-session' \; display-popup -E -w 80% -h 60% -T " ccm Dashboard " "$HOME/Dropbox/code/ccm/ccm dashboard"

# prefix + C (uppercase): ccm menu popup
bind C run-shell 'printf "#{session_name}" > /tmp/ccm-popup-session' \; display-popup -E -w 60% -h 40% -T " ccm Menu " "$HOME/Dropbox/code/ccm/ccm menu"

# prefix + t: Tree popup (toggle)
bind t run-shell 'printf "#{session_name}" > /tmp/ccm-popup-session' \; display-popup -E -w 80% -h 60% -T " ccm Tree " "$HOME/Dropbox/code/ccm/ccm tree-interactive"

# Restore prefix + w to default (choose-tree)
bind w choose-tree -Zs

# Clear stale function key bindings
unbind F1
unbind F2

# Click on status-right to open dashboard
bind -T root MouseDown1StatusRight run-shell 'printf "#{session_name}" > /tmp/ccm-popup-session' \; display-popup -E -w 80% -h 60% -T " ccm Dashboard " "$HOME/Dropbox/code/ccm/ccm dashboard"
