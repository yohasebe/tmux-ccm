# ccm - tmux keybindings (window-based architecture)
# Add to your tmux.conf (before TPM init):
#   source-file "$HOME/Dropbox/dotfiles/ccm/ccm.tmux.conf"

# prefix + Tab: Dashboard popup
bind Tab display-popup -E -w 80% -h 60% -T " ccm Dashboard " "$HOME/Dropbox/dotfiles/ccm/ccm dashboard"

# prefix + C (uppercase): ccm menu popup
bind C display-popup -E -w 60% -h 40% -T " ccm Menu " "$HOME/Dropbox/dotfiles/ccm/ccm menu"

# Restore prefix + w to default (choose-tree)
bind w choose-tree -Zs

# Clear stale function key bindings
unbind F1
unbind F2

# Click on status-right to open dashboard
bind -T root MouseDown1StatusRight display-popup -E -w 80% -h 60% -T " ccm Dashboard " "$HOME/Dropbox/dotfiles/ccm/ccm dashboard"
